name: Check MinHook vcpkg Overlay

on:
  schedule:
    # Twice a year, at 04:20 UTC on January 1 and July 1.
    - cron: '20 4 1 1,7 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-minhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check stable upstream MinHook tags
        id: minhook
        run: python3 scripts/check-minhook-update.py

      - name: Propose overlay port update
        if: steps.minhook.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-minhook
          base: master
          delete-branch: true
          add-paths: |
            vcpkg-ports/minhook/vcpkg.json
            vcpkg-ports/minhook/portfile.cmake
          commit-message: "deps(vcpkg): update MinHook to v${{ steps.minhook.outputs.version }}"
          title: "deps(vcpkg): update MinHook to v${{ steps.minhook.outputs.version }}"
          body: |
            Scheduled semiannual check found a newer stable MinHook release.

            Updates the custom vcpkg overlay manifest version and the pinned
            upstream Git commit in portfile.cmake together.

            Upstream release: https://github.com/TsudaKageyu/minhook/releases/tag/v${{ steps.minhook.outputs.version }}

            Please validate the native build before merging. No auto-merge is enabled.
